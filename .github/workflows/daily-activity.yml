name: Daily Repository Maintenance

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC (Morning Slot)
    - cron: "30 4 * * *"
    # 02:00 PM IST = 08:30 UTC (Afternoon Slot)
    - cron: "30 8 * * *"
    # 06:00 PM IST = 12:30 UTC (Evening Slot)
    - cron: "30 12 * * *"
    # 09:30 PM IST = 16:00 UTC (Night Slot)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select maintenance task or commit target"
        required: true
        type: choice
        options:
          - "auto (4-8 commits distributed)"
          - "batch-fill (reach today's 4-8 target immediately)"
          - "4-commits"
          - "6-commits"
          - "8-commits"
          - "inventory"
          - "quality"
          - "metrics"
          - "health"
          - "security"
          - "audit"
          - "system"
          - "summary"
        default: "auto (4-8 commits distributed)"

permissions:
  contents: write

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git identity
        env:
          COMMIT_NAME: ${{ secrets.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ secrets.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "Missing COMMIT_NAME or COMMIT_EMAIL repository secret."
            exit 1
          fi

          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

      - name: Run daily maintenance automation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/daily_update.py "$MANUAL_MODE"
          else
            python scripts/daily_update.py "auto"
          fi
